build:
  system: auto
  command: "CGO_ENABLED=0 GOOS=linux go build -trimpath -tags netgo,osusergo -ldflags='-s -w' -o out ."

start_command: "./out"

scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.1
  min_memory: 128
  max_memory: 256
  max_http_requests_per_replica: 100

health_check:
  type: tcp
  interval_in_seconds: 10
