
build:
  system: auto
  command: "CGO_ENABLED=0 GOOS=linux go build -trimpath -tags netgo,osusergo -ldflags='-s -w' -o ./bin/bermuda-portal . && ./bin/bermuda-portal --prefetch-worker"
  min_cpu: 0.5
  max_cpu: 2
  min_memory: 512
  max_memory: 2048

working_directory: "/"
start_command: "./bin/bermuda-portal"

scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.25
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024
  max_http_requests_per_replica: 1000

health_check:
  type: http
  http_path: "/healthz"
  interval_in_seconds: 10
